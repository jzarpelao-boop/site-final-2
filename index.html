<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Trio Mexicano - Brawl Stars</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }

        .author {
            color: #ff9900;
            font-size: 16px;
            font-weight: bold;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        /* Estilo do Botão do El Primo */
        .btn-el-primo {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background-color: #ff9900;
            border: 3px solid #000000;
            border-radius: 12px;
            text-decoration: none;
            box-shadow: 0 6px 0 #b36b00, 0 8px 10px rgba(0, 0, 0, 0.5);
            transition: all 0.1s ease;
            margin-top: 20px;
        }

        .btn-el-primo:hover {
            background-color: #ffad33;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #b36b00, 0 10px 12px rgba(0, 0, 0, 0.5);
        }

        .btn-el-primo:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b36b00, 0 4px 6px rgba(0, 0, 0, 0.5);
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            border: 4px solid #ff9900;
            margin-top: 15px;
        }

        footer {
            margin-top: 40px;
            font-size: 14px;
            color: #aaaaaa;
            border-top: 1px solid #333355;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>O TRIO DO BRAWL STARS</h1>
        <p class="author">Desenvolvido por João Pedro Zarpelão</p>
    </header>

    <main>
        <h2>Trio Artistas Mexicanos</h2>
        <p>Formado por El Primo, Poco e Amber!</p>

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQCZwo3qr3OGxaTGbNkXKAH2eGbiyI6EHMBRV835RbrRjRz2IFmb5DcLqo&s=10" alt="Trio Mexicano do Brawl Stars">

        <br><br>

        <!-- Botão de Link com seu nome -->
        <a href="https://www.google.com/search?q=hist%C3%B3ria+do+el+primo+brawl+stars" target="_blank" class="btn-el-primo">
            Ver história do El Primo no Google - João Pedro Zarpelão
        </a>
    </main>

    <footer>
        <p>Site criado por <strong>João Pedro Zarpelão</strong></p>
    </footer>

</body>
</html>
