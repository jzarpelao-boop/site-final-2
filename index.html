<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>O Trio Mexicano - Brawl Stars</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }

        /* Estilo do Botão do El Primo */
        .btn-el-primo {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background-color: #ff9900;
            border: 3px solid #000000;
            border-radius: 12px;
            text-decoration: none;
            box-shadow: 0 6px 0 #b36b00, 0 8px 10px rgba(0, 0, 0, 0.5);
            transition: all 0.1s ease;
            margin-top: 20px;
        }

        .btn-el-primo:hover {
            background-color: #ffad33;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #b36b00, 0 10px 12px rgba(0, 0, 0, 0.5);
        }

        .btn-el-primo:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b36b00, 0 4px 6px rgba(0, 0, 0, 0.5);
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            border: 4px solid #ff9900;
            margin-top: 15px;
        }
    </style>
</head>
